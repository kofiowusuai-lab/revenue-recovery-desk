async function initSupabaseClient(){
  const r=await fetch(API_BASE+'/api/client-config');
  const text=await r.text();
  let cfg={};
  try{cfg=text?JSON.parse(text):{}}catch(e){throw new Error('Client auth configuration returned an invalid response.');}

}

.access_token},body:JSON.stringify(body||{})});const text=await r.text();let j;try{j=text?JSON.parse(text):{}}catch{j={ok:false,error:r.status===404?'Dashboard API unavailable on this domain. Please refresh and try again.':'Unexpected server response. Please refresh and try again.'}}if(!r.ok||!j.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}

on></div></section>`}function notices(){return`<h1>Notifications</h1><div class="list">${state.notifications.map(n=>`<div class="item"><div class="row"><b>${n.title}</b><span class="badge ${n.read_at?'':'warn'}">${n.read_at?'Read':'Unread'}</span></div><p>${n.body||''}</p></div>`).join('')||'<div class="card">No notifications.</div>'}</div>`}function readiness(){return`<h1>Readiness</h1><div class="list">${readinessItems().map(x=>`<div class="item"><span class="badge ${x[1]?'ok':'warn'}">${x[1]?'Done':'Needs attention'}</span> <b>${x[0]}</b></div>`).join('')}</div>`}function businessInfoView(s,bp,addr){return`<div class="info-card"><h3>${esc(s.company||'Business')}</h3>${infoRows(s,[['Industry','industry'],['Company size','size'],['Website','website'],['Primary contact','primary_contact'],['Billing email','email'],['Phone','phone']])}${addr?`<div class="info-row"><span class="info-label">Address</span><span class="info-value">${esc(addr)}</span></div>`:''}</div>`}function businessInfoEditForm(s,addr){return`<form id="businessInfoForm" class="business-inline-form"><div class="business-edit-grid"><label><b>Business name</b><input name="company" value="${esc(s.company||'')}"></label><label><b>Industry</b><input name="industry" value="${esc(s.industry||'')}"></label><label><b>Company size</b><input name="size" value="${esc(s.size||'')}"></label><label><b>Website</b><input name="website" value="${esc(s.website||'')}"></label><label><b>Primary contact</b><input name="primaryContact" value="${esc(s.primary_contact||'')}"></label><label><b>Main phone</b><input name="phone" value="${esc(s.phone||'')}"></label><label class="wide"><b>Business / trading address</b><input name="address" value="${esc(addr)}" placeholder="Street, city, postcode"></label></div><div class="business-inline-actions"><button class="pill primary" type="submit">Save business info</button><button class="pill" type="button" data-business-cancel>Cancel</button><span id="businessMsg" class="muted"></span></div></form>`}function settings(){const s=displaySubmission(),bp=s.business_profile||{},pay=s.payment_stack||{},crm=s.crm_data||{},out=s.outreach||{},g=s.guardrails||{},auto=((g&&g.autoSendChannels)||[]).length>0,contacts=s.contacts||[],addr=bp.address||bp.tradingAddress||'';return`<h1>Settings</h1>${isFauxAccount()?'<span class="badge warn">Faux demo data</span>':''}<div class="grid two settings-layout" style="margin-top:14px"><section class="card grid business-card"><div class="business-head"><h2>Business information</h2><button class="pill" type="button" data-business-edit>${state.businessEdit?'Close':'Edit'}</button></div>${state.businessEdit?businessInfoEditForm(s,addr):businessInfoView(s,bp,addr)}<div class="grid stats compact-info-grid"><div class="item compact-item"><b>Customer profile</b>${infoRows(bp,[['Model','businessModel'],['Customer type','customerType'],['Payment terms','paymentTerms'],['Typical invoice','typicalInvoiceSize']])}</div><div class="item compact-item"><b>Stack</b>${infoRows(pay,[['Payment platforms','platforms'],['Accounting','accounting'],['Payment links','canGeneratePaymentLinks']])}${infoRows(crm,[['CRM','crm'],['Records','recordCount'],['Data quality','dataQuality']])}</div></div><div class="item compact-item"><div class="contacts-title">Contacts</div><div class="contact-list">${contacts.map(c=>`<div class="contact-line"><span class="contact-name">${esc(c.name||c.role||'Contact')}</span><span class="contact-meta">${esc([c.role,c.email,c.phone].filter(Boolean).join(' · '))}</span></div>`).join('')||'<p class="muted">No contacts recorded yet.</p>'}</div></div><div class="integration-support-card secure-access-inline"><h3>Secure setup</h3><b>Connect Google Workspace</b><p class="muted">Link your Google Workspace so the recovery desk can read the billing context it needs. You sign in on Google&rsquo;s own consent screen and grant read-only access. No 2FA is required to connect.</p><div class="account-tools"><button id="connectGoogle" class="pill primary" type="button">Connect Google Workspace</button></div><p id="connectMsg" class="muted"></p><p class="muted" style="margin-top:14px">For other API, vault, CRM, or accounting connections, email <a href="mailto:support@flowaudit.co.uk">support@flowaudit.co.uk</a> or ask us to schedule a meeting. We verify identity first, then handle the connection with you live.</p></div></section><section class="grid settings-side"><form id="settingsForm" class="card settings-form compact-settings"><div class="form-section"><h2>Outreach mode</h2><select name="outreachMode"><option value="draft" ${auto?'':'selected'}>Draft: approvals required</option><option value="auto" ${auto?'selected':''}>Auto: email/SMS send automatically</option></select><p class="muted">Letters always need a signer and can never be auto-sent.</p></div><div class="form-section"><h2>Process owner</h2><div class="field-stack"><input name="contactName" placeholder="Name" value="${esc((contacts[0]&&contacts[0].name)||s.contact_name||'')}"><input name="contactEmail" type="email" placeholder="Email" value="${esc((contacts[0]&&contacts[0].email)||s.email||'')}"></div><div class="save-row"><button class="pill primary" type="submit">Save settings</button><p id="settingsMsg" class="muted"></p></div></div><div class="form-section"><h2>Recovery policy</h2>${infoRows(out,[['From name','fromName'],['Timezone','timezone'],['Business hours','businessHours'],['Sending domain','sendingDomain']])}${infoRows(g,[['Approval model','approvalModel'],['Do-not-contact','doNotContact'],['Max discount','maxDiscount'],['Daily batch','batchSize']])}</div></form><div class="card account-card"><h2>Account</h2><div class="account-tools"><input id="accountPassword" type="password" placeholder="New password"><button id="changePassword" class="pill">Change password</button></div></div></section></div>`}function findEventByKey(key){return displayEvents().find(e=>eventKey(e)===key)}function findApprovalByKey(key){return approvalItems().find(e=>e.approvalId===key||eventKey(e)===key)}function closeEditor(){document.getElementById('approvalEditor')?.remove()}function approveEvent(key){openApprovalEditor(key,true)}async function rejectApproval(key){const e=findApprovalByKey(key);if(!e)return;const reason=prompt('What needs to change?')||'';if(!e.approvalId){alert('Change request saved in preview only.');return}await api('/api/client-approval-action',{action:'reject',approvalId:e.approvalId,reason});await loadData()}function bodyParagraphs(text){return String(text||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)}function renderPortalLetterPreview(subject, body, e, signerName, signerTitle, signatureData){const paras=bodyParagraphs(body),s=displaySubmission(),signer=signerName||(s.outreach&&s.outreach.fromName)||'Accounts Receivable Team',company=signerTitle||s.company||'Northern Peak Solutions',customer=e.customer_name||'Customer Account',invoice=e.invoice_number||e.invoice_id||'Invoice',amount=money(e.amount_usd);return `<div class="secure-access-preview-shell"><div class="letter-preview-page"><div class="target-letter-hero" aria-label="Northern Peak mountain lake letterhead image"></div><div class="target-letter-content"><div class="target-letter-top"><div class="target-letter-meta"><div class="letter-date">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div><div class="addr">Accounts Payable Team<br>${esc(customer)}<br>Billing Address</div></div><aside class="target-letter-brand"><img class="target-letter-brand-img" src="https://revenue-recovery-web-ivory.vercel.app/assets/northern-peak-logo-contact-reference.jpg" alt="NORTHERN PEAK SOLUTIONS logo and contact details"></aside></div><div class="target-letter-main"><div class="subject">Subject: ${esc(subject||'Overdue invoice reminder')}</div><div class="body-copy letter-main-copy">${paras.map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}<p><b>Invoice:</b> ${esc(invoice)}<br><b>Amount due:</b> ${esc(amount)}</p><div class="signature-zone">${signatureData?`<img class="signature-img" src="${signatureData}" alt="Uploaded signature preview">`:'<div class="signature-placeholder">Signature preview</div>'}<div>Sincerely,</div><div class="signer-name">${esc(signer)}</div><div class="signer-title">${esc(company)}</div></div></div></div></div><div class="target-letter-footer"><span>INNOVATE</span>•<span>COLLABORATE</span>•<span>ELEVATE</span></div></div></div>`}function openApprovalEditor(key,approved=false){const e=findApprovalByKey(key)||findEventByKey(key);if(!e)return;closeEditor();const isLetter=/letter/i.test(e.channel||''),body=draftText(e),subject=draftSubject(e);const wrap=document.createElement('div');wrap.id='approvalEditor';wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${isLetter?'Letter':'Draft'} approval editor"><div class="row"><div><h2>${isLetter?'Preview / edit letter':'Edit then approve'}</h2><p class="muted">${esc(e.customer_name||'Customer')} · ${esc(e.invoice_number||e.invoice_id||'Invoice')} · ${money(e.amount_usd)}</p></div><button class="pill" data-close-editor type="button">Close</button></div><div class="edit-grid"><form class="grid" id="approvalEditForm"><label><b>Subject</b><input name="subject" value="${esc(subject)}"></label><label><b>${isLetter?'Letter text':'Message text'}</b><textarea class="textarea-tall" name="body">${esc(body)}</textarea></label><p class="template-lock">Format locked: clients can edit wording only. The preview uses the same Postal Portal full-page letter template; layout/template changes happen from Settings → Letter template.</p><div><button class="pill primary" type="submit">${approved?'Confirm approval':'Approve edited draft'}</button> <button class="pill" data-close-editor type="button">Cancel</button></div><p id="approvalEditMsg" class="muted"></p></form><section><h3>${isLetter?'Postal Portal letter preview':'Message preview'}</h3><div class="postal-preview-card" id="postalPreviewStage">${renderPortalLetterPreview(subject,body,e)}</div></section></div></div>`;wrap.addEventListener('click',ev=>{if(ev.target===wrap||ev.target.closest('[data-close-editor]'))closeEditor()});document.body.appendChild(wrap);const form=wrap.querySelector('#approvalEditForm'),preview=wrap.querySelector('#postalPreviewStage');const update=()=>{preview.innerHTML=renderPortalLetterPreview(form.subject.value,form.body.value,e)};form.body.addEventListener('input',update);form.subject.addEventListener('input',update);form.addEventListener('submit',async ev=>{ev.preventDefault();try{approvalEditMsg.textContent='Saving approval…';if(e.approvalId){await api('/api/client-approval-action',{action:approved?'approve':'edit_approve',approvalId:e.approvalId,subject:form.subject.value,draftText:form.body.value});approvalEditMsg.textContent='Approved. It is queued for the gated sender; nothing sends from the browser.';await loadData();closeEditor()}else{approvalEditMsg.textContent='Approved in dashboard preview. The gated executor still controls live sending.'}}catch(err){approvalEditMsg.textContent=err.message||'Could not save approval.'}})}
async function uploadTemplate(){const file=document.getElementById('letterUpload').files[0];if(!file)return;const objectPath=sid()+'/'+crypto.randomUUID()+'.'+(file.name.split('.').pop()||'pdf').toLowerCase();const up=await sb.storage.from('letter-templates').upload(objectPath,file,{upsert:false});if(up.error)throw up.error;await api('/api/client-settings',{letters:{templatePath:objectPath}});await loadData()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('settingsForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),email=f.get('contactEmail');try{settingsMsg.textContent='Saving…';await api('/api/client-settings',{outreachMode:f.get('outreachMode'),contacts:email?[{name:f.get('contactName'),email,role:'Process owner'}]:undefined});settingsMsg.textContent='Saved. Settings updated.';await loadData()}catch(err){settingsMsg.textContent=err.message||'Could not save settings. Please refresh and try again.'}});document.querySelector('[data-business-edit]')?.addEventListener('click',()=>{state.businessEdit=!state.businessEdit;render()});document.querySelector('[data-business-cancel]')?.addEventListener('click',()=>{state.businessEdit=false;render()});document.getElementById('businessInfoForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{businessMsg.textContent='Saving…';await api('/api/client-settings',{businessInfo:{company:f.get('company'),industry:f.get('industry'),size:f.get('size'),website:f.get('website'),primaryContact:f.get('primaryContact'),phone:f.get('phone'),address:f.get('address')}});businessMsg.textContent='Saved.';state.businessEdit=false;await loadData()}catch(err){businessMsg.textContent=err.message||'Could not save business details.'}});document.getElementById('uploadTemplate')?.addEventListener('click',()=>uploadTemplate().catch(e=>alert(e.message)));document.getElementById('changePassword')?.addEventListener('click',async()=>{const p=accountPassword.value;const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Password changed')});document.getElementById('connectGoogle')?.addEventListener('click',async()=>{const btn=document.getElementById('connectGoogle');try{btn.disabled=true;connectMsg.textContent='Preparing secure Google connection…';const j=await api('/api/client-vault-link',{provider:'google',mode:'connect'});if(j&&j.url){connectMsg.textContent='Redirecting to Google…';location.href=j.url}else{throw new Error('No connection link was returned.')}}catch(err){btn.disabled=false;connectMsg.textContent=err.message||'Could not start the Google connection. Please try again.'}});document.querySelectorAll('[data-edit-key]').forEach(b=>b.addEventListener('click',()=>openApprovalEditor(b.dataset.editKey)));document.querySelectorAll('[data-approve-key]').forEach(b=>b.addEventListener('click',()=>approveEvent(b.dataset.approveKey)));document.querySelectorAll('[data-reject-key]').forEach(b=>b.addEventListener('click',()=>rejectApproval(b.dataset.rejectKey).catch(e=>alert(e.message||'Could not reject approval'))));document.querySelectorAll('[data-portal-select-key]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();rememberPortalSigner();selectPortalLetter(b.dataset.portalSelectKey)}));document.querySelectorAll('[data-portal-preview-key]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();rememberPortalSigner();selectPortalLetter(b.dataset.portalPreviewKey);openPortalPreview()}));document.querySelectorAll('[data-portal-letter]').forEach(b=>b.addEventListener('click',()=>{rememberPortalSigner();selectPortalLetter(b.dataset.portalLetter)}));document.querySelector('[data-portal-preview]')?.addEventListener('click',openPortalPreview);document.getElementById('portalSignatureUpload')?.addEventListener('change',ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;rememberPortalSigner();const sel=selectedPortalEvent(),k=sel?eventKey(sel):'';const r=new FileReader();r.onload=()=>{state.portalSignature=r.result;if(k){(state.portalDrafts[k]||(state.portalDrafts[k]={})).signatureData=r.result}portalMsg.textContent='Signature uploaded for preview.'};r.readAsDataURL(f)});document.querySelector('[data-portal-approve]')?.addEventListener('click',async()=>{const e=selectedPortalEvent(),n=document.getElementById('portalSignerName')?.value.trim(),t=document.getElementById('portalSignerTitle')?.value.trim();if(!e){portalMsg.textContent='Choose a pending letter first.';return}if(!n||!t||!state.portalSignature){portalMsg.textContent='Add signer name, signer title/team, and a signature upload before approval.';return}try{portalMsg.textContent='Saving signed approval…';const j=await api('/api/client-letter-action',{action:'approve',letterKey:eventKey(e),signerName:n,signerTitle:t,signatureData:state.portalSignature});portalMsg.textContent='Signed approval saved. Live sending remains gated until the operator executor verifies it.';state.portalSignature=null;delete state.portalDrafts[eventKey(e)];await loadData()}catch(err){portalMsg.textContent=err.message||'Could not save approval.'}});document.querySelector('[data-portal-reject]')?.addEventListener('click',async()=>{const e=selectedPortalEvent();if(!e){portalMsg.textContent='Choose a pending letter first.';return}const reason=prompt('What needs to change on this letter?')||'';try{portalMsg.textContent='Saving change request…';await api('/api/client-letter-action',{action:'request_changes',letterKey:eventKey(e),reason});portalMsg.textContent='Change request saved.';await loadData()}catch(err){portalMsg.textContent=err.message||'Could not save change request.'}})}
loginForm.addEventListener('submit',async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){loginErr.textContent=r.error.message;return}await boot()});resetForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/client-auth',{action:'complete-reset',password:newPassword.value});await sb.auth.refreshSession();await boot()}catch(err){resetErr.textContent=err.message}});signOut.addEventListener('click',async()=>{await sb.auth.signOut();show('login')});bell.addEventListener('click',()=>{drawer.classList.toggle('hidden');drawer.innerHTML='<h2>Recent notifications</h2>'+(state.notifications.slice(0,8).map(n=>`<div class="item"><b>${n.title}</b><p>${n.body||''}</p></div>`).join('')||'<p>No notifications.</p>')});
async function boot(){if(forceLoginRequested()){await sb.auth.signOut();history.replaceState(null,'',location.pathname);show('login');return}const sess=(await sb.auth.getSession()).data.session;if(!sess){show('login');return}state.session=sess;state.user=sess.user;if(sess.user.app_metadata&&sess.user.app_metadata.must_reset){show('reset');return}show('app');try{await loadClientAccount();if(state.account&&state.account.must_reset){show('reset');return}await loadData()}catch(e){state.loadError=e.message;renderLoadError(e.message);return}const id=sid();if(id){sb.channel('client-dashboard-'+id).on('postgres_changes',{event:'*',schema:'public',table:'recovery_events',filter:'submission_id=eq.'+id},loadData).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'submission_id=eq.'+id},loadData).subscribe();setInterval(loadData,30000)}}initSupabaseClient().then(boot).catch(e=>{loginErr.textContent=e.message;show('login')});
</script></body></html>

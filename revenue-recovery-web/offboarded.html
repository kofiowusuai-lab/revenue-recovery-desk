<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offboarding Payment Received</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root{--green:#16A34A}
    *{box-sizing:border-box}
    body{margin:0}
    header.app-header{display:flex;align-items:center}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-text{display:flex;flex-direction:column;line-height:1.15}
    .brand-text .sub{font-size:12px}
    main{max-width:760px;margin:0 auto;padding:48px 20px}
    .ring{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;background:#DCFCE7;color:var(--green);display:grid;place-items:center;font-size:36px}
    .card{padding:44px 28px;text-align:center}
    h1{margin:0 0 8px;font-size:26px}
    p{font-size:15px;line-height:1.6}
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="fa-wordmark">FlowAudit</span><span class="brand-divider" aria-hidden="true"></span>
    <div class="brand-text"><span class="title">Revenue Recovery Desk</span><span class="sub">Client Offboarding</span></div>
  </div>
</header>
<main>
  <div class="card">
    <div class="ring">✓</div>
    <h1>Payment received</h1>
    <p>Thanks — your final payment has been submitted. We’ll now complete offboarding, take down active systems/integrations, archive the account, and email confirmation when finished.</p>
  </div>
</main>
</body>
</html>
